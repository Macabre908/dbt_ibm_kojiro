models:
  - name: stg_nations
    description: Table for nations data
    columns:
      - name: nation_id
        description: Primary Key for nation's table
        data_tests:
          - unique
          - not_null 
  - name: stg_regions 
    columns:
      - name: name
        data_tests:
          - accepted_values:
              arguments: 
                values: ['AFRICA', 'AMERICA', 'ASIA', 'EUROPE']
              config: 
                store_failures: true
  - name: stg_orders
    columns:
      - name: total_price
        data_tests:
          - order_tests:
              arguments:
                val: 850
              config: 
                store_failures: true
  
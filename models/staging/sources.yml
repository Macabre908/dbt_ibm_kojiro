sources:
  - name: src 
    database: SOURCEDB
    schema: MKMALL
    tables:
      - name: regions 
      - name: nations 
      - name: customers 
      - name: orders
        config: 
          freshness: 
            warn_after: {count: 6, period: day}
            error_after: {count: 12, period: day}
          loaded_at_field: o_orderdate::timestamp_ntz
      - name: lineitems
        config: 
          freshness: 
            warn_after: {count: 6, period: day}
            error_after: {count: 12, period: day}
          loaded_at_field: l_commitdate::timestamp_ntz
            